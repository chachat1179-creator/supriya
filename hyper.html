<body>
    <div id="background"></div>
<style>
    .return {
        background-color: white;
        width: 110px;
        height: 35px;
        cursor: pointer;
        border-color: gold;
        border-radius: 10px;
        font-weight:bold;
        font-style: normal;
        transition: background-color 1s;
    }
    .return:hover{
        background-color: gold;

    }
    .Product {
        margin-bottom: 50px;
        font-size: 25;
        padding-bottom: 18px;
        padding-top: 18px;
        background-color: rgb(249, 125, 116);
        font-weight: bold;
        color: rgb(79, 61, 23);
        text-align: center;
    }
    .stock {
        color: green;
        font-weight: bold;
        font-size: 18;
        text-align: center;
    }
    .cart {
        background-color:white;
        width: 106px;
        height: 35px;
        color:none;
        border-radius: 18px;
        border-color:rgb(194, 172, 1);
        cursor: pointer;
        transition: background-color 0.25s;
        text-align: center;
    }
    .cart:hover{
        background-color: rgb(194, 171, 0);
    }
    .buy {
        background-color: white;
        border-color:rgb(255, 111, 0);
        width: 106px;
        height: 35px;
        color: black;
        border-radius: 18px;
        cursor: pointer;
        transition: background-color 0.15s;
        text-align: center;

    }
    .buy:hover {
        background-color: rgb(255, 111, 0);
        color: white;
    }
    .delivery{
        color:goldenrod;
        text-align: center;
    }
</style>
<a 
     href="https://www.youtube.com/">
<button 
     class="Return">Return to Homepage
</button>
</a>
<p
     class="Product">Nike Black Running Shoes LIMITED Piece, Only Avaivable at Bikram's Shoes Store.
</p>
<p 
     class="stock">$39 - in Stock
</p>
<p
     class="delivery">Free Deliver upto Next Monday
</p>
<button
     class="cart">Add to Cart
</button>
<a 
     href="https://www.youtube.com/" target="_blank">
<button 
     class="buy">Buy Now
</button>
</a>
</body>
